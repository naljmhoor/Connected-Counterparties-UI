<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Connected Counterparties</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Real admin portal self-hosts Cairo (Regular/SemiBold/Bold as separate font-family names);
     Google Fonts' weighted Cairo family is the public equivalent used here for the same look. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: replicate existing Manafa Admin Portal shell (top bar + entity bar + fixed sidebar).
   Connected Counterparties has two sections (Relationships / Risk Groups) inside the normal page.
   Complex reviews (a suggested group, an approved group) take over the content area as a full-page
   workspace with a breadcrumb back — not a drawer, not stacked modals. Relationship inspection
   happens in one consistent, non-blocking side panel regardless of entry point (table row or graph). */
:root{
  /* Values below are pulled directly from the real Manafa Admin Portal's own stylesheet
     (backend-style-admin.min.css) and the Related CRs / summary_card / summary_pill /
     action-btn / simple-table rules specifically — not invented. See the design notes
     at the end of this file for exactly which real selector each token was read from. */
  --bg-page:#f9f9f9; --bg-card:#ffffff; --bg-sidebar:#ffffff; --bg-subtle:#f2f2f2;
  --border:#e6e6e7; --border-strong:#d6dae3;
  --text-primary:#03020f; --text-secondary:#5a656b; --text-tertiary:rgba(3,2,15,.5);
  --accent:#0c66e4; --accent-hover:#0052cc; --accent-fg:#ffffff; --accent-tint:#e9f2ff;
  --primary-btn:#293be0; --primary-btn-hover:#0065ff;
  --secondary-btn-bg:rgba(9,30,66,.04); --secondary-btn-text:#42526e;
  --success:#1b7f3b; --success-tint:#e7f6ec;
  --warning:#8a6116; --warning-tint:#fdf3d7;
  --danger:#b42318; --danger-tint:#fdeaea;
  --neutral-pill:rgba(9,30,66,.059); --neutral-pill-text:#717171;
  --table-header-bg:#03020f; --table-border:#2b2b2b; --table-stripe:rgba(10,52,94,.059);
  --switch-off:#dfe1e6; --switch-on:#0052cc;
  --radius:8px; --radius-sm:3px; --radius-lg:8px; --radius-pill:100px;
  --shadow:none; --shadow-lg:0 8px 24px rgba(16,24,40,.14), 0 2px 6px rgba(16,24,40,.08);
  --sidebar-w:264px; --topbar-h:56px; --searchbar-h:64px; --insp-w:580px;
  color-scheme:light;
}
/* Manafa's Admin Panel is light-only — this page intentionally does not follow system/browser dark mode. */
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg-page); color:var(--text-primary);
  font-family:'Cairo',-apple-system,"Segoe UI",system-ui,Roboto,Arial,sans-serif;
  font-size:13.5px; line-height:1.45;
  padding-left:max(0px, env(safe-area-inset-left,0px));
  padding-right:max(0px, env(safe-area-inset-right,0px));
}
h1,h2,h3,h4,h5{color:var(--text-primary); font-weight:700;}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
table{border-collapse:collapse;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}

/* ---------- Top bar ---------- */
.topbar{
  height:var(--topbar-h); display:flex; align-items:center; gap:22px;
  padding:0 20px; background:var(--bg-card); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:40;
}
.app-switcher{display:flex; align-items:center; gap:8px; font-weight:700; padding-right:18px; border-right:1px solid var(--border); white-space:nowrap;}
.app-switcher .grid-ico{width:18px;height:18px;border-radius:4px;background:var(--text-primary);opacity:.85;}
.topnav{display:flex; align-items:center; gap:4px; flex:1; overflow-x:auto;}
.topnav a{
  display:flex; align-items:center; gap:4px; padding:7px 12px; border-radius:8px;
  color:var(--text-primary); text-decoration:none; font-weight:500; white-space:nowrap; cursor:pointer;
}
.topnav a.active{background:var(--bg-subtle); font-weight:600;}
.topnav a svg{opacity:.55;}
.topbar-right{display:flex; align-items:center; gap:16px; margin-left:auto;}
.icon-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--text-secondary);}
.icon-btn:hover{background:var(--bg-subtle);}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-tint);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}

/* ---------- Entity search bar ---------- */
.entitybar{
  min-height:var(--searchbar-h); display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:14px 20px; background:var(--bg-page); border-bottom:1px solid var(--border);
}
.cr-select{display:flex; align-items:center; gap:6px; background:var(--accent); color:var(--accent-fg); border:none; padding:10px 14px; border-radius:8px; font-weight:600; cursor:pointer;}
.cr-input{flex:0 1 260px; min-width:160px; padding:10px 12px; border:1px solid var(--border-strong); border-radius:8px; background:var(--bg-card); color:var(--text-primary);}
.cr-search-btn{width:40px;height:40px;border-radius:8px;background:var(--accent);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.entity-title{margin-left:auto; text-align:right; font-weight:800; font-size:19px; direction:rtl; min-width:0;}
.entity-title .en{direction:ltr; display:inline-block; color:var(--text-primary);}

/* ---------- Shell ---------- */
.shell{display:flex; align-items:flex-start;}
.sidebar{
  width:var(--sidebar-w); flex:0 0 auto; background:var(--bg-sidebar); border-right:1px solid var(--border);
  height:calc(100vh - var(--topbar-h) - var(--searchbar-h)); overflow-y:auto; padding:10px 0;
}
.side-item{
  display:flex; align-items:center; gap:10px; padding:10px 18px; color:var(--text-secondary);
  font-weight:500; cursor:pointer; white-space:nowrap; border-left:5px solid transparent;
}
.side-item svg{opacity:.6; flex:0 0 auto;}
.side-item:hover{background:var(--bg-subtle);}
/* Matches the real .sidebarNavList a.active rule exactly: #e9f2ff bg, 5px #0c66e4 left
   border, #0c66e4 text, bold weight (the real stylesheet swaps to a literal Cairo-Bold
   font-family here — we use font-weight 700 on the single Cairo family instead). */
.side-item.active{color:var(--accent); font-weight:700; background:var(--accent-tint); border-left-color:var(--accent);}
.side-item.active svg{opacity:1;}
.side-item .chev{margin-left:auto; opacity:.5;}
.side-item.new-badge::after{content:"New"; margin-left:auto; background:var(--accent); color:#fff; font-size:9.5px; font-weight:800; padding:2px 6px; border-radius:20px; letter-spacing:.3px;}

.main{flex:1; min-width:0; padding:18px 22px 60px; max-width:100%; position:relative;}
.page-head{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
.page-head .hamburger{opacity:.5;}
.page-head h1{font-size:17px; margin:0; font-weight:700;}
.proto-role-switch{display:flex; align-items:center; gap:7px;}
.proto-role-switch .lbl{font-size:10.5px; color:var(--text-tertiary); font-weight:600;}
.seg{display:flex; background:var(--bg-subtle); border-radius:7px; padding:2px; gap:2px;}
.seg button{border:none; background:transparent; padding:5px 10px; border-radius:5px; font-weight:600; font-size:12px; cursor:pointer; color:var(--text-secondary);}
.seg button.active{background:var(--bg-card); color:var(--text-primary); box-shadow:var(--shadow);}

/* ---------- Tabs ---------- */
.tabbar{display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--border); padding-bottom:0;}
.tabbar button{
  border:none; background:transparent; padding:10px 4px; margin-right:22px; font-weight:600; font-size:14px;
  color:var(--text-secondary); cursor:pointer; border-bottom:2.5px solid transparent; display:flex; align-items:center; gap:7px;
}
.tabbar button.active{color:var(--accent); border-bottom-color:var(--accent);}
.tabbar button .count{background:var(--neutral-pill); color:var(--text-secondary); font-size:11px; font-weight:700; padding:1px 7px; border-radius:20px;}
.tabbar button.active .count{background:var(--accent-tint); color:var(--accent);}

/* ---------- Breadcrumb (workspace pages) ---------- */
/* Matches the real .nav-breadcrumb: Cairo-SemiBold 14px/700, muted #03020f-at-50% text,
   "/" separators, 20px bottom margin. */
.breadcrumb{display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap;}
.breadcrumb .crumb-trail{color:var(--text-tertiary); font-size:14px; font-weight:700;}
.breadcrumb .crumb-trail strong{color:var(--text-primary); font-weight:700;}
.breadcrumb .crumb-trail .sep{margin:0 8px; color:var(--text-tertiary);}

/* ---------- Cards / generic ---------- */
/* Matches the real .panel-box/.summary_card combo: white bg, 1px #e6e6e7 border, 8px radius. */
.card{background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:16px;}
.card + .card{margin-top:16px;}
.card-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.card-head h3{font-size:14px; margin:0; font-weight:700;}
.card-head .sub{color:var(--text-tertiary); font-size:12px;}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.spacer{flex:1;}

/* Matches the real .action-btn / .defult-btn / .white-bg-btn specs exactly: 32px height,
   130px min-width, 3px radius, Cairo-SemiBold 14px (we use weight 600 on one family). */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:var(--radius-sm); height:32px; min-width:130px; padding:0 14px; font-weight:600; font-size:13px; cursor:pointer; border:1px solid transparent; white-space:nowrap;}
.btn-primary{background:var(--primary-btn); color:#fff;}
.btn-primary:hover{background:var(--primary-btn-hover);}
.btn-outline{background:var(--secondary-btn-bg); border-color:transparent; color:var(--secondary-btn-text);}
.btn-outline:hover{background:var(--accent-tint);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-danger-outline{background:var(--bg-card); border-color:var(--danger); color:var(--danger);}
.btn-ghost{background:transparent; color:var(--text-secondary); border:none; min-width:0;}
.btn-ghost:hover{background:var(--bg-subtle);}
/* Matches the real .action-btn.disabled exactly: a flat light-gray state, not a dimmed
   brand color — disabled buttons never hint at what color they'd be if enabled. */
.btn:disabled{background:rgba(9,30,66,.03)!important; color:#717171!important; opacity:1; cursor:not-allowed;}
.btn-sm{height:28px; min-width:0; padding:0 10px; font-size:12px;}
.icon-only{width:32px;height:32px;min-width:0;padding:0;justify-content:center;}

/* Matches the real .summary_pill component exactly: 100px radius, 13px/600 weight, 2px 12px
   padding, and a dot that just inherits the pill's own text color (currentColor). */
.pill{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; line-height:22px; padding:2px 12px; border-radius:var(--radius-pill); white-space:nowrap;}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.pill-success{background:var(--success-tint); color:var(--success);}
.pill-warning{background:var(--warning-tint); color:var(--warning);}
.pill-danger{background:var(--danger-tint); color:var(--danger);}
.pill-neutral{background:var(--neutral-pill); color:var(--neutral-pill-text);}
.pill-accent{background:var(--accent-tint); color:var(--accent);}

.badge{font-size:11px; font-weight:600; padding:3px 8px; border-radius:6px; background:var(--bg-subtle); color:var(--text-secondary); border:1px solid var(--border);}
.badge-external{background:var(--warning-tint); color:var(--warning); border-color:transparent;}
.badge-more{background:transparent; color:var(--accent); border-color:transparent; padding-left:2px;}

/* Matches the real .simple-table/.table-striped combo exactly: black header with white bold
   text, 1px #e6e6e7 cell borders, 14px/35px-tall rows, 3px 6px padding, no wrapping, and a
   subtle navy-tinted stripe on odd rows (rgba(10,52,94,.059)) — the look used by every real
   data table in the admin portal (incl. the existing Related CRs precursor to this feature). */
table.data{width:100%; border-collapse:collapse; font-size:14px;}
table.data th{text-align:left; color:#fff; font-weight:700; background:var(--table-header-bg); padding:3px 6px; height:35px; border:1px solid var(--table-border); white-space:nowrap;}
table.data td{padding:3px 6px; height:35px; border:1px solid var(--border); vertical-align:middle;}
table.data tbody tr:nth-of-type(odd){background:var(--table-stripe);}
table.data tr.total-row td{font-weight:800; background:var(--bg-subtle);}
table.data td.num, table.data th.num{text-align:right; font-variant-numeric:tabular-nums;}
table.data tr.clickable{cursor:pointer;}
table.data tr.clickable:hover{background:var(--accent-tint);}
.table-scroll{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border);}
.table-scroll table.data{border:none;}

/* Compact KPI strip — a slim banded row of figures, used in place of oversized stat-grid
   cards on the Financing & Exposure and Repayment Performance tabs. */
.kpi-strip{display:flex; flex-wrap:wrap; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-card); margin-bottom:14px; overflow:hidden;}
.kpi-item{flex:1 1 150px; padding:9px 16px; border-right:1px solid var(--border);}
.kpi-item:last-child{border-right:none;}
.kpi-item .lbl{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.2px; color:var(--text-tertiary); margin-bottom:2px;}
.kpi-item .val{font-size:15px; font-weight:800; color:var(--text-primary); font-variant-numeric:tabular-nums;}

/* Enterprise table add-ons, scoped to the financial workspace tables only — no wrapping,
   a company-name column that stays put while scrolling wide payment-class tables, and a
   clickable company name that jumps back to that company's Relationship Inspector. */
.table-enterprise td, .table-enterprise th{white-space:nowrap;}
.table-sticky-col th:first-child, .table-sticky-col td:first-child{position:sticky; left:0; background:var(--bg-card); z-index:1;}
.table-sticky-col tr.total-row td:first-child{background:var(--bg-subtle);}
.co-link{color:var(--accent); cursor:pointer; font-weight:600;}
.co-link:hover{text-decoration:underline;}
.val-negative{color:var(--danger);}

.company-cell{display:flex; align-items:center; gap:10px;}
.company-cell .avatar-sq{width:30px;height:30px;border-radius:7px;background:var(--accent-tint);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex:0 0 auto;}
.company-cell .name{font-weight:600;}
.company-cell .meta{color:var(--text-tertiary); font-size:11px;}

/* ---------- Relationship hierarchy: company summary + type accordion + detail cards ---------- */
.type-badges{display:flex; flex-wrap:wrap; gap:4px;}
.status-summary{display:flex; gap:10px; flex-wrap:wrap; font-size:11.5px; color:var(--text-secondary);}
.status-summary .ss-item{display:flex; align-items:center; gap:5px;}
.status-summary .ss-dot{width:7px;height:7px;border-radius:50%; flex:0 0 auto;}
.status-summary .ss-dot.Active{background:var(--success);}
.status-summary .ss-dot.Historical{background:var(--text-tertiary);}
.status-summary .ss-dot.Excluded{background:var(--border-strong);}

.insp-eyebrow{font-size:10.5px; font-weight:800; letter-spacing:.3px; text-transform:uppercase; color:var(--text-tertiary);}
.insp-type{border-bottom:1px solid var(--border); padding-bottom:16px; margin-bottom:16px;}
.insp-type:last-child{border-bottom:none; margin-bottom:0; padding-bottom:0;}
.insp-type-head{display:flex; align-items:center; gap:10px; padding:4px 0; cursor:pointer;}
.insp-type-head:hover .ty-name{color:var(--accent);}
.insp-type-head .ty-name{font-weight:700; font-size:13.5px; flex:1;}
.insp-type-head .ty-count{color:var(--text-tertiary); font-size:11.5px;}
.insp-type-head .chev{transition:transform .12s; color:var(--text-tertiary); flex:0 0 auto;}
.insp-type.expanded .insp-type-head .chev{transform:rotate(90deg);}
.insp-type-body{display:none; padding:12px 0 0 22px;}
.insp-type.expanded .insp-type-body{display:block;}

.detail-card{background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-top:10px;}
.detail-card:first-child{margin-top:0;}
.detail-card .dc-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.detail-card .dc-origin{font-size:10.5px; font-weight:700; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:.2px;}
.detail-card .dc-origin.manual{color:var(--accent);}
.detail-card .dc-fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px 18px; margin-bottom:10px;}
.detail-card .dc-field label{display:block; font-size:10.5px; color:var(--text-tertiary); font-weight:700; text-transform:uppercase; letter-spacing:.2px; margin-bottom:2px;}
.detail-card .dc-field .v{font-size:12.5px; color:var(--text-primary); font-weight:600;}

.empty{text-align:center; padding:30px 12px; color:var(--text-tertiary);}
.empty svg{opacity:.4; margin-bottom:8px;}
.empty.ok svg{color:var(--success); opacity:.9;}

.banner{display:flex; align-items:flex-start; gap:12px; padding:13px 16px; border-radius:var(--radius); margin-bottom:16px;}
.banner-warning{background:var(--warning-tint); border:1px solid color-mix(in srgb, var(--warning) 35%, transparent);}
.banner svg{flex:0 0 auto; color:var(--warning); margin-top:1px;}
.banner .txt strong{display:block; margin-bottom:2px; color:var(--text-primary);}
.banner .txt p{margin:0; color:var(--text-secondary); font-size:12.5px;}
.banner .actions{margin-left:auto; display:flex; gap:8px; flex:0 0 auto;}

.criteria-list{display:flex; flex-direction:column; gap:9px;}
.criteria-item{display:flex; align-items:flex-start; gap:9px; font-size:12.5px;}
.criteria-item svg{flex:0 0 auto; margin-top:1px;}
.criteria-item.met{color:var(--text-primary);}
.criteria-item.unmet{color:var(--danger);}
.criteria-item .meta{color:var(--text-tertiary); font-size:11.5px; display:block;}

.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px;}
.stat-tile{background:var(--bg-subtle); border-radius:var(--radius); padding:13px 14px;}
.stat-tile .lbl{color:var(--text-tertiary); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.3px;}
.stat-tile .val{font-size:19px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums;}
.stat-tile .val.big{font-size:23px;}

/* ---------- Risk Groups (Option 3): plain section headings on the page background — the
   card is the only box. One card template for every entity; no card wraps another card. ---------- */
.rg-section{margin-bottom:22px;}
.rg-section:last-child{margin-bottom:0;}
.rg-section-head{display:flex; align-items:baseline; gap:10px; margin-bottom:10px;}
.rg-section-head h3{margin:0; font-size:14px; font-weight:700; color:var(--text-primary);}
.rg-section-head .sub{color:var(--text-tertiary); font-size:12px;}

.rg-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:10px;}
.rg-card{display:flex; flex-direction:column; gap:5px; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-card);}
.rg-card.is-attention{background:var(--warning-tint); border-color:var(--warning);}
.rg-row1{display:flex; align-items:center; gap:7px;}
.rg-eyebrow{font-size:10.5px; font-weight:800; letter-spacing:.3px; text-transform:uppercase; color:var(--text-tertiary);}
.rg-eyebrow.accent{color:var(--accent);}
.rg-id{font-weight:800; font-size:13.5px; color:var(--text-primary);}
.rg-flag{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; color:var(--warning);}
.rg-date{margin-left:auto; font-size:11px; color:var(--text-tertiary); white-space:nowrap;}
.rg-title{font-weight:800; font-size:13.5px; color:var(--text-primary);}
.rg-meta{font-size:12px; color:var(--text-secondary);}
.rg-row3{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:3px;}
.rg-amount{font-weight:800; font-size:13.5px; color:var(--text-primary); font-variant-numeric:tabular-nums;}

.rg-card-mini{display:flex; flex-direction:column; gap:7px; padding:14px 16px; border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-card); cursor:pointer;}
.rg-card-mini:hover{border-color:var(--accent); box-shadow:var(--shadow-sm,0 1px 3px rgba(0,0,0,.06));}
.rg-card-mini:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.rg-mini-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.rg-mini-id{font-weight:800; font-size:13.5px; color:var(--text-primary);}
.rg-mini-title{font-weight:800; font-size:13.5px; color:var(--text-primary);}
.rg-mini-row{display:flex; align-items:center; justify-content:space-between; font-size:12.5px;}
.rg-mini-lbl{color:var(--text-tertiary);}
.rg-mini-val{font-weight:700; color:var(--text-primary); font-variant-numeric:tabular-nums;}

.member-row{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px; background:var(--bg-page);}

/* ---- Derived status helpers for the company -> type -> detail hierarchy ---- */
function typeStatus(type){
  const ds = type.details;
  if(ds.every(d=>d.excluded)) return 'Excluded';
  if(ds.some(d=>!d.excluded && d.status==='Active')) return 'Active';
  return 'Historical';
}
function companyStatusCounts(co){
  const counts = {Active:0, Historical:0, Excluded:0};
  co.relationshipTypes.forEach(t=> counts[typeStatus(t)]++);
  return counts;
}
function companyLastUpdated(co){
  let max='';
  co.relationshipTypes.forEach(t=> t.details.forEach(d=>{ if(d.updated>max) max=d.updated; }));
  return max;
}

/* Filters operate at the relationship-TYPE level, not at the company level: the chips and
   the "+N more" count only ever reflect the types matching the current Active/Historical
   filter, recalculated dynamically — never a hardcoded count and never one overall status
   for the company connection. Full detail for every type, in any status, stays one click
   away in the Inspector regardless of what the table currently shows. */
function latestUpdateAmongTypes(types){
  let max='';
  types.forEach(t=>t.details.forEach(d=>{ if(d.updated>max) max=d.updated; }));
  return max || '—';
}

  const co = relatedCompanies.find(x=>x.id===id);
  const firstVisible = co ? co.relationshipTypes.findIndex(t=>typeStatus(t)===relFilter) : -1;

  renderInspector();
}
function closeInspector(){ inspectorCompanyId=null; renderInspector(); }
window.openInspector = openInspector; window.closeInspector = closeInspector;

function toggleType(idx){ inspectorExpanded[idx] = !inspectorExpanded[idx]; renderInspector(); }

/* Inspector respects the Relationships table's own Active/Historical filter — opening a
   company from the Active view shows only its Active relationship types (and vice versa),
   so the table and the Inspector are never out of sync. typeIdx always refers to the index
   in the company's FULL relationshipTypes array (not the filtered list), so detail actions
   keep addressing the right record regardless of which types are currently visible. */
function renderInspector(){
  const root = document.getElementById('inspectorRoot');
  if(!inspectorCompanyId){ root.innerHTML=''; return; }
  const co = relatedCompanies.find(x=>x.id===inspectorCompanyId);
  if(!co){ root.innerHTML=''; return; }
  const visible = co.relationshipTypes
    .map((t,i)=>({t,i}))
    .filter(({t})=>typeStatus(t)===relFilter);
  root.innerHTML = `
    <div class="insp-panel">
      <div class="insp-head">
        <div class="avatar-sq" style="width:36px;height:36px;border-radius:9px;background:var(--accent-tint);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;">${initials(co.company.name)}</div>
        <div style="flex:1;">
          <div class="name">${co.company.name} ${!co.company.registered?'<span class="badge badge-external">Not Registered</span>':''}</div>
          <div class="meta">${companyMetaLine(co.company)}</div>
        </div>
        <button class="btn btn-ghost icon-only" onclick="closeInspector()">${icons.x}</button>
      </div>
      <div class="insp-body">
        <div class="insp-eyebrow" style="margin-bottom:10px;">${relFilter} relationship types</div>
        ${visible.length===0 ? emptyState('No '+relFilter.toLowerCase()+' relationship types','Switch the filter above to see this company’s other relationship types.') :
          visible.map(({t,i})=>typeSectionMarkup(co, t, i)).join('')}
      </div>
    </div>`;
}

function typeSectionMarkup(co, type, typeIdx){
  const st = typeStatus(type);
  const pillClass = st==='Active' ? 'pill-success' : 'pill-neutral';
  const expanded = !!inspectorExpanded[typeIdx];
  return `<div class="insp-type ${expanded?'expanded':''}">
    <div class="insp-type-head" onclick="toggleType(${typeIdx})">
      <span class="chev">${icons.chevronRight}</span>
      <span class="ty-name">${type.type}</span>
      <span class="pill ${pillClass}"><span class="dot"></span>${st}</span>
    </div>
    <div class="insp-type-body">${type.details.map((d,j)=>detailCardMarkup(co, typeIdx, type, d, j)).join('')}</div>
  </div>`;
}

function detailStatusPill(d){
  if(d.excluded) return `<span class="pill pill-neutral"><span class="dot"></span>Excluded</span>`;
  return d.status==='Active' ? `<span class="pill pill-success"><span class="dot"></span>Active</span>` : `<span class="pill pill-neutral"><span class="dot"></span>Historical</span>`;
}

/* UC001/UC003: system-discovered records (ownership, management, shared PN/guarantee) are
   never directly edited or ended by an Admin — only Excluded/Restored. Only Admin-created
   (manual) records support Edit/End/Reactivate, and never Exclude as well (avoids two
   actions that would do the same job). Exclusion is a separate state from Historical and
   is never merged into it in the data model. */
function isSystemRecord(d){ return !!(d.source && d.source.indexOf('System')===0); }

function detailCardMarkup(co, typeIdx, type, d, detailIdx){
  const isActing = inspectorAction && inspectorAction.typeIdx===typeIdx && inspectorAction.detailIdx===detailIdx;
  // Only show a detail-level status pill when it adds information the type header doesn't
  // already give — i.e. it's Excluded, or it genuinely differs from the type's own status.
  const showPill = d.excluded || d.status !== typeStatus(type);
  return `<div class="detail-card">
    <div class="dc-head">${showPill ? detailStatusPill(d) : ''}<span class="hint" style="margin:0 0 0 auto;">${d.updated}</span></div>
    <div class="dc-fields">${d.fields.map(f=>`<div class="dc-field"><label>${f.label}</label><div class="v">${f.value}</div></div>`).join('')}
      <div class="dc-field"><label>Source</label><div class="v">${d.source}</div></div>
    </div>
    ${d.exclusionReason?`<div class="field" style="margin-bottom:8px;"><label>Exclusion reason</label>${d.exclusionReason}</div>`:''}
    ${d.endedReason?`<div class="field" style="margin-bottom:8px;"><label>End reason</label>${d.endedReason}</div>`:''}
    ${isActing ? detailActionForm(co, typeIdx, type, d, detailIdx) : detailActionButtons(co, typeIdx, type, d, detailIdx)}
  </div>`;
}

function detailActionButtons(co, typeIdx, type, d, detailIdx){
  if(d.excluded){
    return `<div class="insp-actions"><button class="btn btn-outline btn-sm" onclick="restoreDetail('${co.id}',${typeIdx},${detailIdx})">Restore</button></div>`;
  }
  const manual = !isSystemRecord(d);
  let btns = '';
  if(manual){
    if(d.status==='Active'){
      btns += `<button class="btn btn-outline btn-sm" onclick="inspectorAction={typeIdx:${typeIdx},detailIdx:${detailIdx},mode:'edit'};renderInspector();">Edit</button>`;
      btns += `<button class="btn btn-danger-outline btn-sm" onclick="inspectorAction={typeIdx:${typeIdx},detailIdx:${detailIdx},mode:'end'};renderInspector();">End relationship</button>`;
    } else {
      btns += `<button class="btn btn-outline btn-sm" onclick="reactivateDetail('${co.id}',${typeIdx},${detailIdx})">Reactivate</button>`;
    }
  } else {
    btns += `<button class="btn btn-outline btn-sm" onclick="inspectorAction={typeIdx:${typeIdx},detailIdx:${detailIdx},mode:'exclude'};renderInspector();">Exclude</button>`;
  }
  return `<div class="insp-actions">${btns}</div>`;
}

function detailActionForm(co, typeIdx, type, d, detailIdx){
  const mode = inspectorAction.mode;
  if(mode==='edit'){
    const first = d.fields[0];
    return `<div class="field"><label>${first.label}</label><textarea id="inspEditField">${first.value}</textarea><div class="hint">Previous value is retained in history automatically.</div></div>
      <div class="row"><button class="btn btn-outline btn-sm" onclick="inspectorAction=null;renderInspector();">Cancel</button><button class="btn btn-primary btn-sm" onclick="saveDetailEdit('${co.id}',${typeIdx},${detailIdx})">Save changes</button></div>`;
  }
  if(mode==='exclude'){
    return `<div class="field"><label>Exclusion scope</label><div class="radio-row"><label><input type="radio" name="exscope${typeIdx}${detailIdx}" checked> This record only</label>${type.details.length>1?`<label><input type="radio" name="exscope${typeIdx}${detailIdx}"> Entire relationship type</label>`:''}</div></div>
      <div class="field"><label>Exclusion reason <span class="req">*</span></label><textarea id="inspExcludeReason" placeholder="Explain why this should be excluded from the Active view…"></textarea><div class="hint">Does not change Active/Historical status — hides it from the default view. Can be restored anytime.</div></div>
      <div class="row"><button class="btn btn-outline btn-sm" onclick="inspectorAction=null;renderInspector();">Cancel</button><button class="btn btn-danger btn-sm" onclick="saveDetailExclude('${co.id}',${typeIdx},${detailIdx})">Exclude</button></div>`;
  }
  if(mode==='end'){
    return `<div class="field"><label>End reason <span class="req">*</span></label><textarea id="inspEndReason" placeholder="e.g. Ownership divested, guarantee released…"></textarea><div class="hint">Moves this record to Historical. History is preserved and it can be reactivated later.</div></div>
      <div class="row"><button class="btn btn-outline btn-sm" onclick="inspectorAction=null;renderInspector();">Cancel</button><button class="btn btn-danger btn-sm" onclick="saveDetailEnd('${co.id}',${typeIdx},${detailIdx})">End</button></div>`;
  }
  return '';
}

function getDetail(coId, typeIdx, detailIdx){
  const co = relatedCompanies.find(x=>x.id===coId);
  return co.relationshipTypes[typeIdx].details[detailIdx];
}
function saveDetailEdit(coId, typeIdx, detailIdx){
  const d = getDetail(coId, typeIdx, detailIdx);
  d.fields[0].value = document.getElementById('inspEditField').value;
  d.updated = new Date().toISOString().slice(0,10);
  inspectorAction=null; renderInspector(); renderRelationshipsPanel();
}

function saveDetailExclude(coId, typeIdx, detailIdx){
  const d = getDetail(coId, typeIdx, detailIdx);
  d.excluded=true; d.exclusionReason=document.getElementById('inspExcludeReason').value; d.exclusionScope='Specific Connecting Party';
  inspectorAction=null; renderInspector(); renderRelationshipsPanel();
}

function saveDetailEnd(coId, typeIdx, detailIdx){
  const d = getDetail(coId, typeIdx, detailIdx);
  d.status='Historical'; d.endedReason=document.getElementById('inspEndReason').value; d.updated=new Date().toISOString().slice(0,10);
  inspectorAction=null; renderInspector(); renderRelationshipsPanel();
}

function restoreDetail(coId, typeIdx, detailIdx){ getDetail(coId,typeIdx,detailIdx).excluded=false; renderInspector(); renderRelationshipsPanel(); }
window.restoreDetail = restoreDetail;
function reactivateDetail(coId, typeIdx, detailIdx){ const d=getDetail(coId,typeIdx,detailIdx); d.status='Active'; d.updated=new Date().toISOString().slice(0,10); renderInspector(); renderRelationshipsPanel(); }
window.reactivateDetail = reactivateDetail;

function arSetIdType(t){ addRelState.idType=t; addRelState.wathqStatus=null; addRelState.wathqResult=null; addRelState.error=''; renderAddRelModal(); }

function arOnIdInput(){
  const el = document.getElementById('arIdValue');
  // Hard restriction on the input itself: digits only, capped at 10 — handles
  // typing, paste, and autofill alike, since all of them fire this same event.
  const filtered = el.value.replace(/\D/g,'').slice(0,10);
  if(el.value!==filtered) el.value = filtered;
  addRelState.idValue = filtered;
  const btn = document.getElementById('arWathqSearchBtn');
  if(btn) btn.disabled = !isTenDigits(filtered);
  if(addRelState.wathqStatus){
    addRelState.wathqStatus=null; addRelState.wathqResult=null;
    const area = document.getElementById('arWathqArea'); if(area) area.innerHTML='';
    const nextBtn = document.querySelector('.modal-foot .btn-primary'); if(nextBtn) nextBtn.disabled = true;
  }
}
window.arOnIdInput = arOnIdInput;
function arDoWathqSearch(){
  const s = addRelState;
  const digits = document.getElementById('arIdValue').value.replace(/\D/g,'').slice(0,10);
  s.idValue = digits;
  if(!isTenDigits(digits)){ arSetError(`${s.idType==='cr'?'CR':'Unified'} Number must be exactly 10 digits.`); return; }
  s.error='';
  // Re-checking Manafa's own records first prevents creating a duplicate company
  // from an identifier that is already stored, without a separate visible step.
  const existing = COMPANY_DIRECTORY.find(c=>c.cr===digits || c.un===digits);
  if(existing){ s.wathqStatus='success'; s.wathqResult={...existing, alreadyInManafa:true}; renderAddRelModal(); return; }
  const mock = findWathqMock(digits);
  if(mock){ s.wathqStatus='success'; s.wathqResult={...mock, registered:false, alreadyInManafa:false}; }
  else { s.wathqStatus='failed'; s.wathqResult=null; }
  renderAddRelModal();
}
window.arDoWathqSearch = arDoWathqSearch;
function arConfirmWathq(){
  const r = addRelState.wathqResult;
  let entry = COMPANY_DIRECTORY.find(c=>c.cr===r.cr || c.un===r.un);
  if(!entry){
    entry = { id:'cW'+Date.now(), name:r.name, cr:r.cr, un:r.un, registered:false };
    COMPANY_DIRECTORY.push(entry); // retained so future searches find it without re-querying Wathq
  }
  addRelState.companyB = entry;
  addRelState.notFoundMode=false; addRelState.wathqStatus=null; addRelState.wathqResult=null; addRelState.idValue=''; addRelState.error='';
  renderAddRelModal();
}
window.arConfirmWathq = arConfirmWathq;

function arBindStepEvents(){

function arNextFrom(step){

    s.type = checked.value;

      const el = document.getElementById('arDesc');
      const v = el ? el.value.trim() : '';
      if(!v){ arSetError('Description is required.'); return; }
      s.description = v;

  }

function arSave(){
  const s = addRelState;
  const typeLabel = AR_TYPE_LABEL[s.type];
  const fields = s.type==='economic'
    ? [{label:'Description', value: s.description}]
    : [{label:(s.type==='mortgage'?'Mortgage ID':'AOP ID'), value: s.recordId}];

  let co = relatedCompanies.find(c=>c.id===s.companyB.id);
  const isNewCompany = !co;
  if(isNewCompany) co = { id:s.companyB.id, company:{name:s.companyB.name, cr:s.companyB.cr, un:s.companyB.un, registered:s.companyB.registered}, relationshipTypes:[] };

  // UC003: prevent duplicate underlying relationships — same type + same connecting
  // party/record already recorded for this company, regardless of current status.
  const existingType = co.relationshipTypes.find(x=>x.type===typeLabel);
  if(existingType && s.type!=='economic'){
    const dup = existingType.details.find(d=>d.fields[0] && d.fields[0].value===s.recordId);
    if(dup){ arSetError(`${typeLabel} via ${s.recordId} is already recorded for ${co.company.name}.`); return; }
  }

  if(isNewCompany) relatedCompanies.unshift(co);
  const newDetail = { id:'d'+Date.now(), status:'Active', excluded:false, source:'Manual (Admin)', createdBy:'You (Credit Admin)', updated:new Date().toISOString().slice(0,10), fields };
  if(existingType) existingType.details.push(newDetail);
  else co.relationshipTypes.push({type:typeLabel, details:[newDetail]});

  closeOverlay('modalAddRel'); renderRelationshipsPanel();
}
window.arSave = arSave;

/* Option 3: one card per entity, one nesting level. Plain text section headings sit directly on

   own background tint and an extra contextual action, since the BRD keeps its status
   'Approved' throughout (membership and status are frozen, not replaced, until Admin acts). */
function renderRiskGroupsPanel(){

/* Minimal, fully-clickable cards — no buttons, no colored backgrounds. Every detail (criteria,
   connecting parties, exposure, actions) lives inside the workspace a click opens; the card
   itself only ever shows the handful of facts needed to recognize and prioritize an entity. */
function rgCardOpen(fnCall){
  return `onclick="${fnCall}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${fnCall};}"`;
}

function suggestionCardMarkup(sg){
  return `<div class="rg-card-mini" role="button" tabindex="0" ${rgCardOpen(`goToSuggestion('${sg.id}')`)}>
    <div class="rg-mini-top"><span class="rg-eyebrow accent">Suggested</span><span class="pill pill-warning"><span class="dot"></span>Pending Credit Review</span></div>
    <div class="rg-mini-title">${sg.companies.join(' + ')}</div>
    <div class="rg-mini-row"><span class="rg-mini-lbl">Companies</span><span class="rg-mini-val">${sg.companies.length}</span></div>
  </div>`;
}

function membershipCardMarkup(g){
  const totalFacility = g.members.reduce((s,m)=>s+m.facility,0);
  const flagged = !!g.reassessment;
  const dissolved = g.status==='Dissolved';
  const statusPill = dissolved ? `<span class="pill pill-neutral"><span class="dot"></span>Dissolved</span>`
    : `<span class="pill pill-success"><span class="dot"></span>Approved</span>`;
  return `<div class="rg-card-mini" role="button" tabindex="0" ${rgCardOpen(`goToGroup('${g.id}')`)}>

/* Maps a group's qualifying-criteria label to the Relationship type it corresponds to in the
   Relationships tab's own data, so Group Relationships only ever shows real, traceable Entity
   Relationship records — never the Suggestion Engine's separate generic criteria text. */
const CRITERIA_TYPE_MAP = { 'Ownership ≥ 50%':'Shared Ownership', 'Shared Collateral':'Shared Collateral — Mortgage' };

function groupRelationshipsMarkup(g){
  const originating = g.members.find(m=>m.originating);
  const criteriaTypes = g.criteria.map(c=>CRITERIA_TYPE_MAP[c.label]||c.label);
  const rows = [];
  g.members.filter(m=>!m.originating).forEach(m=>{
    const rc = relatedCompanies.find(c=>c.company.name===m.name);
    if(!rc) return;
    rc.relationshipTypes.filter(t=>criteriaTypes.includes(t.type)).forEach(t=>{
      t.details.forEach(d=>{
        const ref = d.fields.find(f=>/connecting party|mortgage id|aop id/i.test(f.label));
        const rest = d.fields.filter(f=>f!==ref).map(f=>`${f.label}: ${f.value}`).join(' · ');
        rows.push({type:t.type, companies:`${originating?originating.name:'—'} ↔ ${m.name}`,
          ref: ref?ref.value:'—', details: rest || (ref?'':d.fields.map(f=>f.value).join(' · ')), pill: detailStatusPill(d)});
      });
    });
  });
  return `<div class="card">
    <div class="card-head"><h3>Group relationships</h3><span class="sub">Entity Relationship records that qualify this group's membership</span></div>
    ${rows.length===0 ? `<div class="hint">No traceable relationship records found for this group's current criteria.</div>` :
    `<div class="table-scroll"><table class="data"><thead><tr><th>Type</th><th>Connected Companies</th><th>Connecting Party / Supporting Reference</th><th>Supporting Details</th><th>Status</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${r.type}</td><td>${r.companies}</td><td>${r.ref}</td><td>${r.details||'—'}</td><td>${r.pill}</td></tr>`).join('')}</tbody></table></div>`}
  </div>`;
}

function repaymentTabMarkup(g){
  const cls = ['early','onTime','l1_7','l8_15','l16_30','l31_90','gt90'];
  const clsLabel = {early:'Early',onTime:'On time',l1_7:'1–7d late',l8_15:'8–15d late',l16_30:'16–30d late',l31_90:'31–90d late',gt90:'>90d late'};

  const totals = {}; cls.forEach(c=>totals[c]=g.members.reduce((s,m)=>s+m.repay[c],0));
  const amtTotals = {}; cls.forEach(c=>amtTotals[c]=g.members.reduce((s,m)=>s+(m.repayAmt?m.repayAmt[c]:0),0));
  const totalFacility = g.members.reduce((s,m)=>s+m.facility,0);
  const totalUtil = g.members.reduce((s,m)=>s+m.outstanding,0);
  const totalPayments = g.members.reduce((s,m)=>s+m.repay.totalPayments,0);
  const groupUtilTimes = totalUtil/totalFacility;
  return `<div class="card">
    <div class="kpi-strip">
      <div class="kpi-item"><div class="lbl">Group facility utilization times</div><div class="val">${groupUtilTimes.toFixed(2)}×</div></div>
      <div class="kpi-item"><div class="lbl">Group total utilization</div><div class="val">${fmtSAR(totalUtil)}</div></div>
      <div class="kpi-item"><div class="lbl">Group total facility amount</div><div class="val">${fmtSAR(totalFacility)}</div></div>
      <div class="kpi-item"><div class="lbl">Total number of payments</div><div class="val">${totalPayments}</div></div>
    </div>
    <div class="table-scroll"><table class="data table-enterprise table-sticky-col"><thead><tr><th>Company</th>${cls.map(c=>`<th class="num" title="${clsTitle[c]}">${clsLabel[c]}</th>`).join('')}<th class="num">Total pmts</th><th class="num">Utilization</th><th class="num">Facility</th><th class="num" title="Utilization ÷ Facility">Util. ×</th></tr></thead>
    <tbody>
    ${g.members.map(m=>`<tr><td>${coCellMarkup(m.name)}</td>${cls.map(c=>`<td class="num">${m.repay[c]}</td>`).join('')}<td class="num">${m.repay.totalPayments}</td><td class="num">${fmtSAR(m.outstanding)}</td><td class="num">${fmtSAR(m.facility)}</td><td class="num">${(m.outstanding/m.facility).toFixed(2)}×</td></tr>`).join('')}
    <tr class="total-row"><td>Total Number of Payments</td>${cls.map(c=>`<td class="num">${totals[c]}</td>`).join('')}<td class="num">${totalPayments}</td><td class="num">${fmtSAR(totalUtil)}</td><td class="num">${fmtSAR(totalFacility)}</td><td class="num">${groupUtilTimes.toFixed(2)}×</td></tr>
    <tr class="total-row"><td>Total Amount of Repayment</td>${cls.map(c=>`<td class="num">${fmtSAR(amtTotals[c])}</td>`).join('')}<td class="num">—</td><td class="num">${fmtSAR(totalUtil)}</td><td class="num">—</td><td class="num">—</td></tr>
    <tr class="total-row"><td>Total Amount of Repayment / Total Utilization</td>${cls.map(c=>`<td class="num">${fmtPct(totalUtil? amtTotals[c]/totalUtil*100 : 0)}</td>`).join('')}<td class="num">—</td><td class="num">100.00%</td><td class="num">—</td><td class="num">—</td></tr>
    </tbody></table></div>
    <div class="hint" style="margin-top:10px;">Total Amount of Repayment / Total Utilization = each classification's Total Amount of Repayment ÷ Group Total Utilization × 100. Group Facility Utilization Times = Group Total Utilization ÷ Group Total Facility Amount (not an average of company ratios).</div>
  </div>`;
}
function financialsTabMarkup(g){
  const sum = k => g.members.reduce((s,m)=>s+(m.fin[k]||0),0);
  return `<div class="card">
    <div class="table-scroll"><table class="data table-enterprise"><thead><tr><th>Company</th><th>FY</th><th class="num">Revenue</th><th class="num">Net income</th><th class="num">Total assets</th><th class="num">Due from</th><th class="num">Total debt</th><th class="num">Equity</th><th class="num" title="Total debt ÷ Equity">Leverage</th></tr></thead>
    <tbody>
    ${g.members.map(m=>`<tr><td>${coCellMarkup(m.name)}</td><td><span class="badge">${m.fin.year}</span></td><td class="num">${fmtSAR(m.fin.revenue)}</td><td class="num">${fmtSARSigned(m.fin.netIncome)}</td><td class="num">${fmtSAR(m.fin.totalAssets)}</td><td class="num">${fmtSAR(m.fin.dueFrom)}</td><td class="num">${fmtSAR(m.fin.totalDebt)}</td><td class="num">${fmtSARSigned(m.fin.equity)}</td><td class="num">${(m.fin.totalDebt/m.fin.equity).toFixed(2)}×</td></tr>`).join('')}
    <tr class="total-row"><td>Total</td><td>—</td><td class="num">${fmtSAR(sum('revenue'))}</td><td class="num">${fmtSARSigned(sum('netIncome'))}</td><td class="num">${fmtSAR(sum('totalAssets'))}</td><td class="num">${fmtSAR(sum('dueFrom'))}</td><td class="num">${fmtSAR(sum('totalDebt'))}</td><td class="num">${fmtSARSigned(sum('equity'))}</td><td class="num">—</td></tr>
    </tbody></table></div>
    <div class="hint" style="margin-top:10px;">Sourced from each member's latest audited Qawaem financial statements. Aggregated figures are for Credit visibility only and are not consolidated financial statements. Financial Year and Leverage are not aggregated.</div>
  </div>`;
}
function historyTabMarkup(g){
  return `<div class="card">${g.history.map(h=>`
    <div class="history-entry">
      <div class="history-dot">${h.type==='Dissolution'?icons.x:h.type.indexOf('Reassessment')===0?icons.alert:h.type==='Membership Modification'?icons.group:icons.check}</div>
      <div><div class="hwhat">${h.type}</div><div class="hwhen">${h.date} · ${h.who}</div><div class="hdetail">${h.detail}</div></div>
    </div>`).join('')}</div>`;
}

/* ---------------- init ---------------- */
renderApp();
</script>

</body></html>
